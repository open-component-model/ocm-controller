suite: controller concurrency
templates:
  - templates/deployment_manager.yaml
tests:
  - it: omits concurrency flags by default
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].args
          count: 7
  - it: configures a subset of controllers without overriding the others
    set:
      manager.concurrency:
        componentVersion: 4
        resource: 2
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --concurrency-component-version=4
      - contains:
          path: spec.template.spec.containers[0].args
          content: --concurrency-resource=2
      - lengthEqual:
          path: spec.template.spec.containers[0].args
          count: 9
  - it: maps every controller name to its binary flag
    set:
      manager.concurrency:
        componentVersion: 2
        resource: 3
        snapshot: 4
        localization: 5
        configuration: 6
        fluxDeployer: 7
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --concurrency-component-version=2
      - contains:
          path: spec.template.spec.containers[0].args
          content: --concurrency-resource=3
      - contains:
          path: spec.template.spec.containers[0].args
          content: --concurrency-snapshot=4
      - contains:
          path: spec.template.spec.containers[0].args
          content: --concurrency-localization=5
      - contains:
          path: spec.template.spec.containers[0].args
          content: --concurrency-configuration=6
      - contains:
          path: spec.template.spec.containers[0].args
          content: --concurrency-flux-deployer=7
      - lengthEqual:
          path: spec.template.spec.containers[0].args
          count: 13
  - it: allows an explicit single worker
    set:
      manager.concurrency.resource: 1
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --concurrency-resource=1
      - lengthEqual:
          path: spec.template.spec.containers[0].args
          count: 8
  - it: omits signing-root-certs wiring by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --signing-root-certs-file=/etc/ocm/trust/roots.pem
      - lengthEqual:
          path: spec.template.spec.containers[0].args
          count: 7
  - it: wires signing root certs independently of registry TLS
    set:
      registry.tls.enabled: false
      manager.signingRootCerts.enabled: true
      manager.signingRootCerts.secretName: my-truststore
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --signing-root-certs-file=/etc/ocm/trust/roots.pem
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: signing-root-certs
            mountPath: "/etc/ocm/trust"
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: signing-root-certs
            secret:
              secretName: my-truststore
              items:
                - key: roots.pem
                  path: roots.pem
  - it: mounts both registry TLS and signing root certs when both enabled
    set:
      registry.tls.enabled: true
      manager.signingRootCerts.enabled: true
      manager.signingRootCerts.secretName: my-truststore
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: signing-root-certs
            mountPath: "/etc/ocm/trust"
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            mountPath: /etc/ssl/certs/registry-root.pem
            subPath: registry-root.pem
            name: certificates

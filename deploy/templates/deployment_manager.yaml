apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocm-controller
  namespace: {{ .Release.Namespace }}
  labels:
    control-plane: controller
    app: ocm-controller
spec:
  selector:
    matchLabels:
      app: ocm-controller
  replicas: {{ .Values.manager.replicaCount }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.manager.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        app: ocm-controller
    spec:
      imagePullSecrets: {{ $.Values.manager.image.imagePullSecrets | toJson }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
        - --zap-log-level=4
        - --leader-elect
        {{- with .Values.manager.concurrency }}
        {{- if .componentVersion }}
        - {{ printf "--concurrency-component-version=%v" .componentVersion | quote }}
        {{- end }}
        {{- if .resource }}
        - {{ printf "--concurrency-resource=%v" .resource | quote }}
        {{- end }}
        {{- if .snapshot }}
        - {{ printf "--concurrency-snapshot=%v" .snapshot | quote }}
        {{- end }}
        {{- if .localization }}
        - {{ printf "--concurrency-localization=%v" .localization | quote }}
        {{- end }}
        {{- if .configuration }}
        - {{ printf "--concurrency-configuration=%v" .configuration | quote }}
        {{- end }}
        {{- if .fluxDeployer }}
        - {{ printf "--concurrency-flux-deployer=%v" .fluxDeployer | quote }}
        {{- end }}
        {{- end }}
        {{- if hasKey .Values.manager "intervalJitterPercentage" }}
        - --interval-jitter-percentage={{ .Values.manager.intervalJitterPercentage }}
        {{- end }}
        - --oci-registry-addr={{ .Values.registry.address }}
        {{- if .Values.registry.tls.enabled }}
        - --certificate-secret-name={{ .Values.tlsCert.secretName }}
        {{- end }}
        {{- if not .Values.registry.tls.enabled }}
        - --oci-registry-insecure-skip-verify
        {{- end }}
        {{- if .Values.manager.signingRootCerts.enabled }}
        - --signing-root-certs-file={{ .Values.manager.signingRootCerts.mountDir }}/{{ .Values.manager.signingRootCerts.key }}
        {{- end }}
        {{- if .Values.manager.kubeAPI }}
        {{- if .Values.manager.kubeAPI.rateLimiterDisabled }}
        - --kube-api-rate-limiter-disabled
        {{- else }}
        {{- if .Values.manager.kubeAPI.qps }}
        - --kube-api-qps={{ .Values.manager.kubeAPI.qps }}
        {{- end }}
        {{- if .Values.manager.kubeAPI.burst }}
        - --kube-api-burst={{ .Values.manager.kubeAPI.burst }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- if .Values.manager.image.fullyQualifiedImageName }}
        image: "{{ .Values.manager.image.fullyQualifiedImageName }}"
        {{- else }}
        image: "{{ .Values.manager.image.repository }}:{{ .Values.manager.image.tag | default .Chart.AppVersion }}"
        {{- end }}
        name: manager
        imagePullPolicy: {{ .Values.manager.image.pullPolicy }}
        {{- if or .Values.registry.tls.enabled .Values.manager.signingRootCerts.enabled }}
        volumeMounts:
        {{- if .Values.registry.tls.enabled }}
        {{- toYaml .Values.manager.volumeMounts | nindent 10 }}
        {{- end }}
        {{- if .Values.manager.signingRootCerts.enabled }}
          - name: signing-root-certs
            mountPath: {{ .Values.manager.signingRootCerts.mountDir | quote }}
            readOnly: true
        {{- end }}
        {{- end}}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
        {{- toYaml .Values.manager.resources | nindent 10 }}
      serviceAccountName: ocm-controller
      terminationGracePeriodSeconds: 10
      {{- if or .Values.registry.tls.enabled .Values.manager.signingRootCerts.enabled }}
      volumes:
      {{- if .Values.registry.tls.enabled }}
      {{- tpl (toYaml .Values.manager.volumes) . | nindent 8 }}
      {{- end }}
      {{- if .Values.manager.signingRootCerts.enabled }}
        - name: signing-root-certs
          secret:
            secretName: {{ .Values.manager.signingRootCerts.secretName | quote }}
            items:
              - key: {{ .Values.manager.signingRootCerts.key | quote }}
                path: {{ .Values.manager.signingRootCerts.key | quote }}
      {{- end }}
      {{- end}}
      {{- if .Values.manager.nodeSelector }}
      nodeSelector:
      {{- toYaml .Values.manager.nodeSelector | nindent 8 }}
      {{- end}}

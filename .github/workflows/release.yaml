name: Release

permissions: {}

on:
  workflow_dispatch:
    inputs:
      release_candidate:
        type: boolean
        description: "Release Candidate"
        required: false
        default: false

env:
  REGISTRY: ghcr.io
  DOCKERFILE: ${{ github.workspace }}/goreleaser.dockerfile

jobs:
  tests:
    uses: ./.github/workflows/tests.yaml
    permissions:
      contents: read
      pull-requests: 'read'
  tag:
    needs: tests
    name: Create release tag
    runs-on: ubuntu-latest
    # Holds the release App credentials. Only first-party actions and git run in
    # this job; publishing happens in a separate job with GITHUB_TOKEN only.
    environment:
      name: release-automation
      deployment: false
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes_file: ${{ steps.version.outputs.notes_file }}
    steps:
    - name: Generate release App token
      id: release-token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
        private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
        repositories: ${{ github.event.repository.name }}
        permission-contents: write
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        # Persisted for the tag push below; this job uploads no artifacts.
        token: ${{ steps.release-token.outputs.token }} # zizmor: ignore[artipacked]
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: '${{ github.workspace }}/go.mod'
        cache: false
    - name: Set release version
      id: version
      env:
        RELEASE_CANDIDATE: ${{ inputs.release_candidate }}
      run: |
        if [[ "${RELEASE_CANDIDATE}" == "true" ]]; then
          version="$(go run ./pkg/version/generate/release_generate.go print-rc-version)"
        else
          version="$(go run ./pkg/version/generate/release_generate.go print-version)"
        fi
        notes_file="docs/release_notes/$(go run ./pkg/version/generate/release_generate.go print-version).md"
        if [[ ! -f "${notes_file}" ]]; then
          >&2 echo "Must have release notes ${notes_file}"
          exit 6
        fi
        echo "RELEASE_VERSION=${version}" >> "${GITHUB_ENV}"
        echo "version=${version}" >> "${GITHUB_OUTPUT}"
        echo "notes_file=${notes_file}" >> "${GITHUB_OUTPUT}"
    - name: Setup git config
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "<41898282+github-actions[bot]@users.noreply.github.com>"
    - name: Create and push tag
      run: |
        git tag --annotate --message "Release ${RELEASE_VERSION}" "${RELEASE_VERSION}"
        git push origin "${RELEASE_VERSION}"
  release:
    needs: tag
    name: Publish release
    runs-on: ubuntu-latest
    permissions:
      contents: 'write'
      id-token: 'write'
      pull-requests: 'read'
      repository-projects: 'write'
      packages: 'write'
    env:
      RELEASE_VERSION: ${{ needs.tag.outputs.version }}
      RELEASE_NOTES_FILE: ${{ needs.tag.outputs.notes_file }}
    steps:
    - name: Self Hosted Runner Post Job Cleanup Action
      uses: TooMuch4U/actions-clean@9b358e33df99574ac0bdf2e92fa3db1ae1415563
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: refs/tags/${{ needs.tag.outputs.version }}
        fetch-depth: 0
        persist-credentials: false
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: '${{ github.workspace }}/go.mod'
    - name: Cache go-build and mod
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ~/.cache/go-build/
          ~/go/pkg/mod/
        key: go-${{ hashFiles('go.sum') }}
        restore-keys: |
          go-
    - name: Log in to the Container registry
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Install Helm
      uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e
    - name: Generate manifests
      run: |
        mkdir -p output
        helm template ./deploy --namespace ocm-system --set "manager.image.tag=${{ env.RELEASE_VERSION }}" --include-crds > ./output/install.yaml
    - name: Setup Syft
      uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
    - name: Setup Cosign
      uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532
    - name: Run goreleaser
      uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de
      with:
        distribution: goreleaser
        version: latest
        args: release --clean --timeout 60m --config=./.goreleaser.yaml --release-notes=${{ env.RELEASE_NOTES_FILE }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GORELEASER_CURRENT_TAG: ${{ env.RELEASE_VERSION }}
    - name: Build and release the helm charts
      run: |
        helm registry login ghcr.io -u open-component-model -p ${{ secrets.GITHUB_TOKEN }}
        helm package --version ${{ env.RELEASE_VERSION }} --app-version ${{ env.RELEASE_VERSION }} ./deploy
        helm push ${{ github.event.repository.name }}-${{ env.RELEASE_VERSION }}.tgz oci://ghcr.io/open-component-model/helm
    - name: Push OCM Components
      env:
        GITHUBORG: ${{ github.repository_owner }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_CANDIDATE: ${{ inputs.release_candidate }}
      run: make plain-push
